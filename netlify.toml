# Static Next.js export. The Python pipeline is NOT run on Netlify (data is pre-built in public/data);
# Netlify still pip-installs requirements.txt, so pin a Python with prebuilt pandas/numpy wheels.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.12"
